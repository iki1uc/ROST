<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌀 LOGIKAL ROOM · NC‑MESH · LEBENDE RESPOS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0b0b0b;
            color: #e0e0e0;
            font-family: 'Consolas', monospace;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: #0e141c;
            border-radius: 16px;
            border: 1px solid #1a2a3a;
            padding: 24px 28px 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        h1 {
            color: #6cf;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        h1 small { color: #5a7a8a; font-size: 14px; font-weight: 300; }

        .flex { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
        .status-row {
            display: flex; flex-wrap: wrap; gap: 12px 24px;
            background: rgba(0,0,0,0.3); border-radius: 10px; padding: 8px 14px;
            margin-bottom: 12px; font-size: 13px; border: 1px solid #1a2a3a;
        }
        .status-row .item { display: flex; align-items: center; gap: 6px; }
        .status-row .label { color: #7a8a9a; }
        .status-row .value { color: #8cf0d0; font-weight: bold; }
        .status-row .value.gold { color: #f0d080; }
        .status-row .value.purple { color: #b388ff; }

        #orbitCanvas {
            background: #000;
            border: 1px solid #1a2a3a;
            display: block;
            margin: 6px 0;
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 8px;
        }

        .btn {
            padding: 6px 14px;
            background: #1a1a2a;
            color: #c0d8c8;
            border: 1px solid #2a3a4a;
            cursor: pointer;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            border-radius: 6px;
            transition: 0.2s;
        }
        .btn:hover { border-color: #6cf; color: #fff; }
        .btn.primary { border-color: #6cf; color: #6cf; }
        .btn.primary:hover { background: rgba(108,204,255,0.1); }
        .btn.danger { border-color: #f44; color: #f44; }
        .btn.danger:hover { background: rgba(255,68,68,0.1); }
        .btn.gold { border-color: #f0d080; color: #f0d080; }
        .btn.gold:hover { background: rgba(240,208,128,0.1); }
        .btn.purple { border-color: #b388ff; color: #b388ff; }
        .btn.purple:hover { background: rgba(179,136,255,0.1); }

        .label { color: #8ab0c0; font-size: 12px; }
        input[type="range"] { width: 120px; background: #1a1a2a; accent-color: #6cf; }

        .badge {
            display: inline-block;
            padding: 1px 10px;
            border-radius: 12px;
            font-size: 11px;
            border: 1px solid #2a3a4a;
        }
        .badge.aktiv { border-color: #8cf0d0; color: #8cf0d0; }
        .badge.pause { border-color: #f0d080; color: #f0d080; }

        #log {
            background: #0a0a12;
            padding: 10px;
            height: 110px;
            overflow: auto;
            font-size: 12px;
            margin-top: 6px;
            border: 1px solid #1a2a3a;
            border-radius: 8px;
            color: #5a7a8a;
            line-height: 1.5;
        }
        #log .time { color: #2a3a4a; }
        #log .msg { color: #8ab0c0; }
        #log .msg.ok { color: #8cf0d0; }
        #log .msg.warn { color: #f0d080; }
        #log .msg.err { color: #f44; }

        .cmd-row {
            display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
            background: rgba(0,0,0,0.2); border-radius: 8px; padding: 6px 12px;
            margin: 6px 0; border: 1px solid #1a2a3a;
        }
        .cmd-row input {
            background: #0a0a12;
            border: 1px solid #2a3a4a;
            border-radius: 4px;
            padding: 4px 10px;
            color: #c0d8c8;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            flex: 1;
            min-width: 80px;
        }
        .cmd-row input::placeholder { color: #4a5a5a; }

        @media (max-width: 700px) {
            .container { padding: 16px; }
            h1 { font-size: 18px; }
            .flex { gap: 6px; }
            .btn { font-size: 10px; padding: 4px 10px; }
        }
    </style>
</head>
<body>

<div class="container">

    <h1>🌀 LOGIKAL ROOM <small>NC‑MESH · lebende Respos · zellulärer Automat</small></h1>

    <!-- STATUS -->
    <div class="status-row">
        <span class="item"><span class="label">🌀 MESH</span> <span class="value" id="meshStatus">AKTIV</span></span>
        <span class="item"><span class="label">⚡ SCORE</span> <span class="value" id="scoreDisplay">0%</span></span>
        <span class="item"><span class="label">⏱ TICK</span> <span class="value gold" id="tickDisplay">0</span></span>
        <span class="item"><span class="label">⚙️ GEAR</span> <span class="value gold" id="gearDisplay">0</span></span>
        <span class="item"><span class="label">🧩 PLUGINS</span> <span class="value purple" id="pluginCount">0/13</span></span>
    </div>

    <!-- CANVAS -->
    <canvas id="orbitCanvas" width="800" height="450"></canvas>

    <!-- STEUERUNG -->
    <div class="flex">
        <button class="btn" id="btnPause">⏸ Pause</button>
        <button class="btn" id="btnStep">▶ Schritt</button>
        <button class="btn danger" id="btnReset">⟲ Reset</button>
        <span class="label">Geschw.</span>
        <input type="range" id="speedSlider" min="1" max="10" value="3">
        <span class="label" id="speedLabel">3×</span>
    </div>

    <!-- COMMAND LINE -->
    <div class="cmd-row">
        <span style="color:#5a7a8a;font-size:12px;">⚡ ATTACK:</span>
        <input id="cmdInput" placeholder="SHOCK / WAVE / PUSH / GROW / MOVE / BREAK / LINK" value="SHOCK">
        <button class="btn primary" id="cmdBtn">▶ SENDEN</button>
        <span id="cmdOut" style="color:#8cf0d0;font-size:11px;"></span>
    </div>

    <!-- AXIOM / PLUGIN INFO -->
    <div class="flex" style="font-size:12px;color:#8ab0c0;gap:16px;margin:4px 0;">
        <span>🌀 IQQ: <span id="axiomIQQ" style="color:#f0d080;">9 → 3 → 9 → 3</span></span>
        <span>◎ OCTA: <span id="axiomOCTA" style="color:#6cf;">◉ ◆ △ ▣ ↺</span></span>
        <span>📐 A81: <span id="axiomA81" style="color:#b388ff;">27 · 81 · 243 · 729</span></span>
    </div>

    <!-- LOG -->
    <div id="log">[init] LOGIKAL ROOM · NC‑MESH geladen …</div>

</div>

<script>
"use strict";

// ================================================================
//  LOGIKAL ROOM · NC‑MESH
//  Zellulärer Automat (Moore-Nachbarschaft) statt Sinus.
//  Attack-Commands: SHOCK, WAVE, PUSH, GROW, MOVE, BREAK, LINK
//  Stabile v3-Architektur: rAF-Loop, Leader-Election
// ================================================================

// ─── DOM REFS ──────────────────────────────────────────────────
const canvas = document.getElementById('orbitCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const logBox = document.getElementById('log');
const scoreDisplay = document.getElementById('scoreDisplay');
const tickDisplay = document.getElementById('tickDisplay');
const gearDisplay = document.getElementById('gearDisplay');
const pluginCountEl = document.getElementById('pluginCount');
const cmdOut = document.getElementById('cmdOut');

// ─── ZELLULÄRER AUTOMAT (81 Zellen, 9×9) ─────────────────────
const COLS = 9, ROWS = 9, TOTAL = 81;
const CELL_SIZE = W / COLS;
const CELL_H = H / ROWS;

let cells = [];
let attackQueue = [];
let tick = 0;
let running = true;
let speed = 3;

// ─── PLUGINS (13 BRAIN-Dateien) ──────────────────────────────
const PLUGIN_NAMES = [
    'NC_figur.js', 'NC_kraft.js', 'NC_space.js', 'NC_time.js',
    'OS_CORE.js', 'axiom.map.js', 'coord.js', 'dreieck.js',
    'resolver.js', 'respo.js', 'router.js', 'vec.js', 'index.html'
];
let plugins = PLUGIN_NAMES.map(n => ({ name: n.replace('.js', ''), active: false }));
let pluginActiveCount = 0;

// ─── INIT ZELLEN ──────────────────────────────────────────────
function initCells() {
    cells = [];
    for (let i = 0; i < TOTAL; i++) {
        const r = Math.floor(i / COLS);
        const c = i % COLS;
        cells.push({
            value: 0.3 + 0.4 * Math.sin(i * 0.2 + 0.5),
            target: 0.5,
            row: r,
            col: c,
            temp: 0
        });
    }
}
initCells();

// ─── NACHBARN (Moore-Nachbarschaft) ──────────────────────────
function getNeighbors(idx) {
    const r = cells[idx].row;
    const c = cells[idx].col;
    const n = [];
    for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                n.push(nr * COLS + nc);
            }
        }
    }
    return n;
}

// ─── ATTACK COMMANDS ──────────────────────────────────────────
function applyAttack(attack) {
    const { type, strength = 0.5, origin = Math.floor(Math.random() * TOTAL) } = attack;
    const originCell = cells[origin];

    switch (type) {
        case 'SHOCK': {
            // Druckwelle
            for (let i = 0; i < TOTAL; i++) {
                const dist = Math.abs(cells[i].row - originCell.row) + Math.abs(cells[i].col - originCell.col);
                const factor = Math.max(0, 1 - dist / 8) * strength;
                cells[i].value = Math.min(1, cells[i].value + factor * 0.3);
            }
            break;
        }
        case 'WAVE': {
            // Harmonische Welle
            for (let i = 0; i < TOTAL; i++) {
                const dist = Math.abs(cells[i].row - originCell.row) + Math.abs(cells[i].col - originCell.col);
                const wave = Math.sin(dist * 0.8 + tick * 0.1) * strength * 0.4;
                cells[i].value = Math.max(0, Math.min(1, cells[i].value + wave));
            }
            break;
        }
        case 'PUSH': {
            // Physischer Stoß
            for (let i = 0; i < TOTAL; i++) {
                const dr = cells[i].row - originCell.row;
                const dc = cells[i].col - originCell.col;
                const dist = Math.sqrt(dr * dr + dc * dc) || 0.1;
                const push = strength * 0.15 / (dist + 0.5);
                cells[i].value = Math.max(0, Math.min(1, cells[i].value + push * (Math.random() > 0.5 ? 1 : -1)));
            }
            break;
        }
        case 'GROW': {
            // Wachstum
            for (let i = 0; i < TOTAL; i++) {
                const dist = Math.abs(cells[i].row - originCell.row) + Math.abs(cells[i].col - originCell.col);
                const factor = Math.max(0, 1 - dist / 6) * strength;
                cells[i].target = Math.min(1, cells[i].target + factor * 0.2);
            }
            break;
        }
        case 'MOVE': {
            // Minecraft-Move: Annäherung an Nachbar-Durchschnitt
            for (let i = 0; i < TOTAL; i++) {
                const neighbors = getNeighbors(i);
                let sum = 0;
                for (const nIdx of neighbors) sum += cells[nIdx].value;
                const avg = neighbors.length > 0 ? sum / neighbors.length : 0.5;
                cells[i].target = cells[i].value * 0.3 + avg * 0.7;
            }
            break;
        }
        case 'BREAK': {
            // Reset / Zerfall
            for (let i = 0; i < TOTAL; i++) {
                if (Math.random() < strength * 0.3) {
                    cells[i].value = Math.random() * 0.2;
                    cells[i].target = 0.3 + Math.random() * 0.4;
                }
            }
            break;
        }
        case 'LINK': {
            // Verbinden: Angleichen an stärksten Nachbarn
            for (let i = 0; i < TOTAL; i++) {
                const neighbors = getNeighbors(i);
                let maxVal = cells[i].value, maxIdx = i;
                for (const nIdx of neighbors) {
                    if (cells[nIdx].value > maxVal) { maxVal = cells[nIdx].value; maxIdx = nIdx; }
                }
                if (maxIdx !== i) {
                    cells[i].target = cells[maxIdx].value * 0.8 + cells[i].target * 0.2;
                }
            }
            break;
        }
    }
}

function queueAttack(type, strength = 0.5, origin = undefined) {
    attackQueue.push({ type, strength, origin });
}

// ─── TICK (zellulärer Automat) ──────────────────────────────
function tickMesh() {
    // Angriffe aus der Queue anwenden
    while (attackQueue.length > 0) {
        const attack = attackQueue.shift();
        applyAttack(attack);
    }

    // Nachbar-Update (Diffusion + Stabilisierung)
    const newValues = new Float32Array(TOTAL);
    for (let i = 0; i < TOTAL; i++) {
        const cell = cells[i];
        const neighbors = getNeighbors(i);
        let sum = 0;
        for (const nIdx of neighbors) sum += cells[nIdx].value;
        const avg = neighbors.length > 0 ? sum / neighbors.length : 0.5;

        // Regel: Trägheit + Nachbar-Einfluss + Ziel-Anziehung
        const influence = 0.12;
        const inertia = 0.7;
        let newVal = cell.value * inertia + avg * influence + cell.target * (1 - inertia - influence);
        newVal = Math.max(0, Math.min(1, newVal + (Math.random() - 0.5) * 0.015));
        newValues[i] = newVal;
    }
    for (let i = 0; i < TOTAL; i++) cells[i].value = newValues[i];
    tick++;
}

// ─── RENDER ──────────────────────────────────────────────────
function renderMesh() {
    ctx.clearRect(0, 0, W, H);

    // Hintergrund
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#04080a');
    grad.addColorStop(1, '#0a0e16');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Gitter
    ctx.strokeStyle = 'rgba(100,180,255,0.04)';
    ctx.lineWidth = 0.5;
    for (let r = 0; r <= ROWS; r++) {
        ctx.beginPath();
        ctx.moveTo(0, r * CELL_H);
        ctx.lineTo(W, r * CELL_H);
        ctx.stroke();
    }
    for (let c = 0; c <= COLS; c++) {
        ctx.beginPath();
        ctx.moveTo(c * CELL_SIZE, 0);
        ctx.lineTo(c * CELL_SIZE, H);
        ctx.stroke();
    }

    // Zellen zeichnen
    for (let i = 0; i < TOTAL; i++) {
        const cell = cells[i];
        const x = cell.col * CELL_SIZE;
        const y = cell.row * CELL_H;
        const val = cell.value;

        // Score-basierte Farbe
        const score = Math.max(0, 1 - Math.abs(val - 0.5) * 2);
        const r = Math.round(200 * (1 - score) + 40 * score);
        const g = Math.round(90 + score * 140);
        const b = 60;

        // Größe abhängig vom Wert
        const size = 0.3 + 0.7 * val;
        const pad = (1 - size) * 0.5;

        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.25 + 0.35 * score)`;
        ctx.fillRect(x + pad * CELL_SIZE, y + pad * CELL_H, size * CELL_SIZE, size * CELL_H);

        // Rand
        ctx.strokeStyle = `rgba(${r+40}, ${g+30}, ${b+20}, 0.1 + 0.15 * score)`;
        ctx.lineWidth = 0.5 + score * 0.5;
        ctx.strokeRect(x + pad * CELL_SIZE, y + pad * CELL_H, size * CELL_SIZE, size * CELL_H);

        // Wert-Anzeige (klein)
        ctx.fillStyle = `rgba(200,230,255, ${0.05 + 0.1 * score})`;
        ctx.font = '7px Consolas';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(val.toFixed(2), x + CELL_SIZE/2, y + CELL_H - 2);
    }

    // Status-Overlay
    const avg = getMeshAvg();
    ctx.fillStyle = 'rgba(100,200,255,0.04)';
    ctx.font = '13px Consolas';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(`⚡ NC-MESH · ${Math.round(avg*100)}% · Tick ${tick}`, 12, 10);

    // Plugin-Count
    ctx.textAlign = 'right';
    ctx.fillText(`🧩 ${pluginActiveCount}/13`, W - 12, 10);

    // Attack-Status
    if (attackQueue.length > 0) {
        ctx.fillStyle = 'rgba(255,200,100,0.06)';
        ctx.textAlign = 'center';
        ctx.fillText(`⚡ ${attackQueue.length} Angriffe in Warteschlange`, W/2, 10);
    }
}

function getMeshAvg() {
    let sum = 0;
    for (const c of cells) sum += c.value;
    return sum / TOTAL;
}

// ─── LOG ────────────────────────────────────────────────────
function log(msg, type = '') {
    const time = new Date().toLocaleTimeString();
    const entry = document.createElement('div');
    const cls = ['ok', 'warn', 'err'].includes(type) ? type : '';
    entry.innerHTML = `<span class="time">[${time}]</span> <span class="msg ${cls}">${msg}</span>`;
    logBox.appendChild(entry);
    logBox.scrollTop = logBox.scrollHeight;
    while (logBox.children.length > 60) logBox.removeChild(logBox.firstChild);
}

// ─── STATUS UI ──────────────────────────────────────────────
function updateStatus() {
    const avg = getMeshAvg();
    scoreDisplay.textContent = Math.round(avg * 100) + '%';
    tickDisplay.textContent = tick;
    gearDisplay.textContent = tick % 12;
    pluginCountEl.textContent = `${pluginActiveCount}/13`;
}

// ─── PLUGIN TOGGLE ──────────────────────────────────────────
function togglePlugin(idx) {
    plugins[idx].active = !plugins[idx].active;
    pluginActiveCount = plugins.filter(p => p.active).length;
    // Plugin-Effekt: Zielwerte leicht anpassen
    const factor = 1 + (pluginActiveCount / plugins.length) * 0.4;
    for (let i = 0; i < TOTAL; i++) {
        const base = 0.5 + 0.4 * Math.sin(i * 0.15);
        cells[i].target = Math.min(1, base * factor);
    }
    updateStatus();
}

// ─── BUTTONS ──────────────────────────────────────────────────
document.getElementById('btnPause').addEventListener('click', () => {
    running = !running;
    document.getElementById('btnPause').textContent = running ? '⏸ Pause' : '▶ Start';
    document.getElementById('meshStatus').textContent = running ? 'AKTIV' : 'PAUSE';
    log(running ? '▶ Fortgesetzt' : '⏸ Pausiert', 'warn');
});

document.getElementById('btnStep').addEventListener('click', () => {
    if (!running) { tickMesh(); renderMesh(); updateStatus(); }
});

document.getElementById('btnReset').addEventListener('click', () => {
    initCells();
    attackQueue = [];
    tick = 0;
    plugins.forEach(p => p.active = false);
    pluginActiveCount = 0;
    for (let i = 0; i < TOTAL; i++) {
        cells[i].target = 0.5 + 0.4 * Math.sin(i * 0.15);
    }
    log('⟲ Reset · alle Zellen neu initialisiert', 'warn');
    updateStatus();
    renderMesh();
});

document.getElementById('cmdBtn').addEventListener('click', () => {
    const input = document.getElementById('cmdInput').value.trim().toUpperCase();
    const valid = ['SHOCK', 'WAVE', 'PUSH', 'GROW', 'MOVE', 'BREAK', 'LINK'];
    if (valid.includes(input)) {
        queueAttack(input, 0.5);
        cmdOut.textContent = `✅ ${input} gesendet`;
        log(`⚡ Attack: ${input}`, 'ok');
    } else {
        cmdOut.textContent = `❌ ${input}? SHOCK/WAVE/PUSH/GROW/MOVE/BREAK/LINK`;
        log(`❌ Unbekannter Befehl: ${input}`, 'err');
    }
});

document.getElementById('cmdInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('cmdBtn').click();
});

const speedSlider = document.getElementById('speedSlider');
const speedLabel = document.getElementById('speedLabel');
speedSlider.addEventListener('input', () => {
    speed = parseInt(speedSlider.value);
    speedLabel.textContent = speed + '×';
});

// ─── LOOP (requestAnimationFrame) ──────────────────────────
let lastFrame = 0;
let accumulator = 0;

function loop(now) {
    if (lastFrame === 0) lastFrame = now;
    const delta = now - lastFrame;
    lastFrame = now;

    if (running) {
        accumulator += delta;
        const stepTime = Math.max(80, 800 - speed * 60);
        let guard = 0;
        while (accumulator >= stepTime && guard < 20) {
            tickMesh();
            accumulator -= stepTime;
            guard++;
            if (guard % 3 === 0) updateStatus();
        }
    }

    renderMesh();
    updateStatus();
    requestAnimationFrame(loop);
}

// ─── INIT ──────────────────────────────────────────────────
log('🌀 LOGIKAL ROOM · NC‑MESH geladen', 'ok');
log('📦 81 Zellen · Moore-Nachbarschaft · zellulärer Automat', 'ok');
log('⌨️  Befehle: SHOCK, WAVE, PUSH, GROW, MOVE, BREAK, LINK', 'warn');
log('🧩 Plugins: Klick auf die Badges unten toggelt', 'warn');

// Plugin-Badges ins UI einfügen
const pluginContainer = document.createElement('div');
pluginContainer.style.cssText = 'display:flex; flex-wrap:wrap; gap:4px; margin:6px 0;';
plugins.forEach((p, idx) => {
    const badge = document.createElement('span');
    badge.style.cssText = `padding:2px 8px; border-radius:10px; font-size:9px; cursor:pointer;
        background:${p.active ? 'rgba(179,136,255,0.2)' : 'rgba(0,0,0,0.2)'};
        border:1px solid ${p.active ? '#b388ff' : '#2a3a4a'}; color:${p.active ? '#b388ff' : '#5a7a8a'};
        transition:0.2s;`;
    badge.textContent = p.name;
    badge.addEventListener('click', () => { togglePlugin(idx); renderMesh(); updateStatus(); });
    pluginContainer.appendChild(badge);
});
document.querySelector('.flex').after(pluginContainer);

// Tastatur
document.addEventListener('keydown', (e) => {
    if (e.key === ' ') { e.preventDefault(); document.getElementById('btnPause').click(); }
    if (e.key === 'r' || e.key === 'R') document.getElementById('btnReset').click();
    if (e.key === 'Enter' && document.activeElement !== document.getElementById('cmdInput')) {
        document.getElementById('cmdBtn').click();
    }
});

// Start
updateStatus();
requestAnimationFrame(loop);

</script>
</body>
</html>
